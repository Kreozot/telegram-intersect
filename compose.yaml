services:
  intersect:
    build:
      context: .
    environment:
      HOST: 0.0.0.0
      PORT: 4310
      DATA_DIR: /app/data
      LOOPBACK_PROXY: "true"
      MAX_SELECTED_PEOPLE: ${MAX_SELECTED_PEOPLE:-50}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
    init: true
    ports:
      - "127.0.0.1:${INTERSECT_PORT:-4310}:4310"
    restart: unless-stopped
    volumes:
      - intersect-data:/app/data

volumes:
  intersect-data:
